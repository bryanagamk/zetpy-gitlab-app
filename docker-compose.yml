services:
  mysql:
    image: mysql:8.0
    container_name: zetpy-gitlab-issues-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gitlab_issues
      MYSQL_USER: zetpy
      MYSQL_PASSWORD: zetpy_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  mysql_data:
